<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Terê Verde | Home</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styleindex.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                <i class="ph ph-mountains"></i>
                <h1>Circuito Terê Verde</h1>
            </a>
        </div>

        <div class="barra-pesquisa">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" placeholder="Para onde vamos hoje?">
        </div>

        <div class="acoes">
            <a href="#" class="btn-perfil" onclick="alternarStatusUsuario()">
                <i class="ph ph-user"></i>
                <span id="status-usuario">Convidado</span>
            </a>
        </div>
    </header>
    <main>
        <div class="card-clima">
            <div class="clima-topo">
                <i class="ph ph-cloud-sun"></i>
                <div class="clima-texto">
                    <h3>Hoje em Teresópolis</h3>
                    <p><strong>4 Parques Abertos</strong></p>
                </div>
            </div>
            <p class="aviso-clima">Clima favorável para trilhas leves.</p>
        </div>

        <section class="categorias">
    <h2>Explore por categoria</h2>
    <div class="grid-categorias">
        
        <a href="index.html" class="card-categoria">
            <i class="ph ph-house-line"></i>
            <p>Página inicial</p>
        </a>

        <a href="trilhas.html" class="card-categoria">
            <i class="ph ph-mountains"></i>
            <p>Trilhas</p>
        </a>

        <a href="eventos.html" class="card-categoria">
            <i class="ph ph-calendar-dots"></i>
            <p>Eventos</p>
        </a>

        <a href="#" class="card-categoria">
            <i class="ph ph-plant"></i>
            <p>Biodiversidade</p>
        </a>

        <a href="#" class="card-categoria">
            <i class="ph ph-binoculars"></i>
            <p>Pontos Turísticos</p>
        </a>

    </div>

</section>
        <div class="boas-vindas">
            <h2>Bem-vindo!</h2>
            <p>Explore a natureza de Teresópolis.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Projeto Terê Verde</p>
    </footer>
    <script>
    function alternarStatusUsuario() {
        const status = document.getElementById("status-usuario");
        if (status.innerText === "Convidado") {
            status.innerText = "Usuário";
        } else {
            status.innerText = "Convidado";
        }
    }
    </script>
</body>
</html>
